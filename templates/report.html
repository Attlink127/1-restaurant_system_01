<!DOCTYPE html>
<!-- report.html — หน้ารายงาน
     โครงสร้างการ์ดสรุปและตารางรายงานถูกสร้างด้วย JavaScript (report.js) ทั้งหมด
     จึงไม่ต้องเขียนหัวข้อ/ตารางของแต่ละรายงานใน HTML เอง -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงาน — Restaurant Ordering</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- แถบด้านบน: ลิงก์สลับไปหน้ารายงาน/หน้าจัดการข้อมูล -->
  <header class="topbar">
    <div class="brand">🍽️ ระบบร้านอาหาร <span>Restaurant Ordering</span></div>
    <nav><a href="/">จัดการข้อมูล</a><a href="/report" class="active">รายงาน</a></nav>
  </header>
  <main class="container">
    <!-- การ์ดตัวเลข: สร้างจาก db.report_summary() อัตโนมัติ -->
    <section class="cards" id="summary"></section>
    <!-- กล่องรายงาน: สร้างจาก db.REPORTS อัตโนมัติ (เพิ่มรายงานที่ db.py ไม่ต้องแก้ไฟล์นี้) -->
    <div id="reports"></div>
  </main>
  <!-- โหลดสคริปต์หน้ารายงาน ( report.js ) ทำงานทันทีเมื่อโหลดเสร็จ -->
  <script src="{{ url_for('static', filename='report.js') }}"></script>
</body>
</html>
